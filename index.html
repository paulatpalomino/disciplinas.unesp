<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Slides das aulas · UNESP-Araraquara</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf7;--ink:#161618;--ink-soft:#3a3a3e;--ink-mute:#6b6b70;--rule:#e2e0d9;--orange:#c2410c;--teal:#115e59;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased;}
.topbar,.quando,.cod,.acoes a,.espera,.tag,.hero-meta{font-family:'IBM Plex Mono',ui-monospace,monospace;}
.topbar{border-bottom:1px solid var(--rule);padding:14px 32px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-mute);}
.topbar b{color:var(--ink);font-weight:600;letter-spacing:.12em;}
main{max-width:1080px;margin:0 auto;padding:0 32px 64px;}
.hero{padding:64px 0 36px;border-bottom:1px solid var(--rule);margin-bottom:24px;}
.hero-meta{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--orange);margin-bottom:18px;}
h1{font-family:'IBM Plex Serif',serif;font-weight:400;font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.02em;margin-bottom:18px;}
h1 em{font-style:italic;color:var(--orange);}
.lede{font-size:18px;font-weight:300;color:var(--ink-soft);max-width:720px;}
ol.aulas{list-style:none;border-top:1px solid var(--rule);}
.aula{display:grid;grid-template-columns:150px 1fr auto;gap:20px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--rule);}
.quando{display:flex;flex-direction:column;font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
.quando .num{color:var(--orange);font-weight:600;}
.quando .data{color:var(--ink-mute);}
.titulo{font-family:'IBM Plex Serif',serif;font-size:20px;line-height:1.3;}
.acoes{display:flex;gap:8px;align-items:center;}
.acoes a{font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:9px 12px;border-radius:3px;border:1px solid var(--ink);color:var(--ink);white-space:nowrap;}
.acoes a.abrir{background:var(--ink);color:#fff;}
.acoes a:hover{border-color:var(--orange);}
.acoes a.abrir:hover{background:var(--orange);}
.acoes a:focus-visible{outline:3px solid var(--orange);outline-offset:2px;}
.espera{display:none;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);white-space:nowrap;}
.aula.futura .titulo,.aula.futura .quando{opacity:.45;}
.aula.futura a{display:none;}
.aula.futura .espera{display:inline;}
.aula.recente{background:#fff;box-shadow:inset 4px 0 0 var(--orange);padding-left:16px;}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:4px;}
.nota{font-size:14px;color:var(--ink-mute);margin-top:28px;max-width:760px;}
footer{border-top:1px solid var(--rule);margin-top:48px;padding-top:20px;font-size:13px;color:var(--ink-mute);}
footer strong{color:var(--ink-soft);}
@media (max-width:720px){
  .topbar{padding:12px 16px;} main{padding:0 16px 48px;} .hero{padding:40px 0 28px;}
  .aula{grid-template-columns:1fr;gap:8px;padding:16px 0;}
  .aula.recente{padding-left:12px;}
  .quando{flex-direction:row;gap:12px;}
  .titulo{font-size:18px;}
}
</style>
</head>
<body>
<header class="topbar"><span><b>UNESP-Araraquara</b> · Administração Pública</span><span>Profa. Dra. Paula Toledo Palomino</span></header>
<main>
  <div class="hero">
    <div class="hero-meta">2º semestre de 2026</div>
    <h1>Slides das <em>aulas</em></h1>
    <p class="lede">Cada disciplina tem o seu endereço. Use o link que a professora publicou no Classroom da sua turma.</p>
  </div>
</main>
</body>
</html>
